version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: registry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-registry_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d registry_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  registry:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: registry_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8008:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
